name: FieldCapture
options:
  bundleIdPrefix: sh.bluedoor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: A698ST8F6D
    CODE_SIGN_STYLE: Automatic
targets:
  FieldCapture:
    type: application
    platform: iOS
    sources: [FieldCapture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.bluedoor.fieldcapture
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: FieldCapture/Info.plist
      properties:
        CFBundleDisplayName: Demo
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Captures document pages for digitization.
        NSMicrophoneUsageDescription: Records spoken notes (box, folder, corrections) during a scanning session.
        NSLocalNetworkUsageDescription: Sends captured pages to the receiving laptop on this network.
        NSBonjourServices: [_fieldscan._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
