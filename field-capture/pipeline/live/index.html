<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Scan</title>
<style>
  :root {
    --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b; --line:#e8e8ed; --soft:#f0f0f3;
    --blue:#0071e3; --green:#28a745; --orange:#f5a623; --red:#e5484d; --purple:#8e59ff;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --Holland:#0a84ff; --Byron:#ff9f0a; --Barnwell:#30b0c7; --PLCB:#bf5af2;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased; }
  header { display:flex; align-items:center; gap:28px; padding:22px 32px 14px; flex-wrap:wrap; }
  .title { font-size:22px; font-weight:600; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--mut); }
  .dot.live { background:var(--red); animation:pulse 1.6s infinite; }
  .dot.done { background:var(--green); }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }
  .counters { display:flex; gap:26px; margin-left:auto; }
  .counter b { display:block; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em; transition:color .4s; }
  .counter b.bump { color:var(--blue); }
  .counter span { font-size:11.5px; color:var(--mut); }
  .controls { display:flex; gap:6px; }
  .controls button { border:0; background:var(--card); box-shadow:var(--shadow); border-radius:99px; padding:6px 12px; font:inherit; font-size:12.5px; color:var(--ink); cursor:pointer; }
  .controls button.on { background:var(--ink); color:#fff; }
  main { display:grid; grid-template-columns:230px minmax(0,1fr) 340px; gap:22px; padding:6px 32px 120px; }
  @media (max-width:1100px) { main { grid-template-columns:1fr; } }
  h2 { font-size:12px; font-weight:600; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  .col { min-width:0; }
  .enter { animation:enter .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes enter { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
  .flash { animation:flash 1.1s ease-out; }
  @keyframes flash { 0% { box-shadow:0 0 0 3px rgba(0,113,227,.35), var(--shadow); } 100% { box-shadow:var(--shadow); } }

  /* incoming */
  .inc { display:flex; gap:10px; align-items:center; background:var(--card); border-radius:12px; padding:8px; margin-bottom:8px; box-shadow:var(--shadow); }
  .inc img { width:44px; height:58px; object-fit:cover; object-position:top; border-radius:6px; background:var(--soft); }
  .inc .n { font-weight:600; font-size:13px; }
  .inc .s { font-size:11.5px; color:var(--mut); }
  .inc .s.filed { color:var(--ink); }
  .spin { display:inline-block; width:9px; height:9px; border:1.5px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-1px; margin-right:4px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* documents */
  .box { margin-bottom:22px; }
  .boxhead { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; margin:0 0 10px; }
  .boxhead i { width:10px; height:10px; border-radius:3px; }
  .boxhead small { color:var(--mut); font-weight:400; font-size:12.5px; }
  .docs { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:12px; }
  .doc { background:var(--card); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); border-top:3px solid var(--c); }
  .doc .top { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .doc h3 { margin:0; font-size:14.5px; font-weight:600; letter-spacing:-.005em; }
  .doc .meta { font-size:12px; color:var(--mut); margin-top:2px; }
  .pill { font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px; white-space:nowrap; }
  .pill.open { background:#fff4e0; color:#a15c00; }
  .pill.complete { background:#e6f6ea; color:#1e7b34; }
  .thumbs { display:flex; gap:6px; margin:12px 0 10px; min-height:66px; }
  .thumbs figure { margin:0; text-align:center; }
  .thumbs img { width:50px; height:66px; object-fit:cover; object-position:top; border-radius:6px; border:1px solid var(--line); display:block; transition:transform .5s; }
  .thumbs figcaption { font-size:10.5px; color:var(--mut); margin-top:2px; }
  .thumbs .slot { width:50px; height:66px; border-radius:6px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:10.5px; color:var(--mut); text-align:center; }
  .fields { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12.5px; }
  .fields dt { color:var(--mut); white-space:nowrap; }
  .fields dd { margin:0; }
  .fields .new { animation:enter .5s; }
  .note { margin-top:9px; font-size:12px; color:var(--blue); }
  .access { display:inline-flex; align-items:center; gap:5px; margin-top:8px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--soft); color:var(--mut); }
  .access.public { background:#e6f6ea; color:#1e7b34; }
  .access.restricted { background:#fdecec; color:#b42318; }
  .access.privileged { background:#efe8ff; color:#6b3fd4; }
  .access small { font-weight:400; opacity:.85; }
  .doc.locked .lockbody { display:flex; align-items:center; gap:12px; margin:14px 0 4px; color:var(--mut); font-size:12.5px; }
  .doc.locked .lockbody b { display:block; color:var(--ink); font-size:13px; }
  .lockicon { width:36px; height:36px; border-radius:10px; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:17px; flex:none; }
  .inc.locked img { filter:blur(6px) grayscale(1); cursor:default; }
  .viewer { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--mut); }
  .viewer select { appearance:none; -webkit-appearance:none; border:0; background:var(--card); box-shadow:var(--shadow); border-radius:99px; padding:6px 28px 6px 12px; font:inherit; font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer;
    background-image:linear-gradient(45deg, transparent 50%, var(--mut) 50%), linear-gradient(135deg, var(--mut) 50%, transparent 50%);
    background-position:calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size:5px 5px; background-repeat:no-repeat; }

  /* right column */
  .panel { background:var(--card); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .etype { font-size:11px; color:var(--mut); margin:8px 0 5px; }
  .etype:first-of-type { margin-top:0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--soft); border-radius:99px; padding:4px 10px; font-size:12.5px; }
  .chip b { font-size:11px; color:var(--mut); font-weight:600; }
  .chip.grow { animation:flash 1s; }
  .issue { border-left:3px solid var(--sev); padding:6px 0 6px 10px; margin-bottom:8px; font-size:12.5px; }
  .issue .h { font-size:11px; font-weight:600; color:var(--sev); text-transform:uppercase; letter-spacing:.04em; }
  .empty { color:var(--mut); font-size:12.5px; }
  .feed div { font-size:12.5px; padding:5px 0; border-top:1px solid var(--line); }
  .feed div:first-child { border-top:0; }
  .feed .v { color:var(--purple); }

  /* voice bar */
  .voicebar { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:rgba(29,29,31,.92); color:#fff; border-radius:99px;
    padding:10px 18px; font-size:14px; max-width:min(760px, 92vw); display:flex; gap:10px; align-items:center; box-shadow:0 10px 30px rgba(0,0,0,.2);
    opacity:0; transition:opacity .4s, transform .4s; pointer-events:none; }
  .voicebar.show { opacity:1; transform:translateX(-50%) translateY(-4px); }
  .voicebar .a { color:#a1a1a6; font-size:12.5px; white-space:nowrap; }
  .inc img, .thumbs img { cursor:zoom-in; }
  .lightbox { position:fixed; inset:0; background:rgba(245,245,247,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; z-index:10; cursor:zoom-out; padding:24px; }
  .lightbox.show { display:flex; animation:enter .25s ease-out; }
  .lightbox img { max-width:min(96vw, 1100px); max-height:88vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.18); background:#fff; }
  .lightbox .cap { font-size:13px; color:var(--mut); }
  .lbstage { position:relative; line-height:0; }
  .lbstage svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .lbstage rect { fill:rgba(0,113,227,.12); stroke:rgba(0,113,227,.85); stroke-width:1.5px; vector-effect:non-scaling-stroke; }
  .lbstage.nobox svg { display:none; }
  /* files view */
  .seg { display:flex; background:var(--card); box-shadow:var(--shadow); border-radius:99px; padding:3px; }
  .seg button { border:0; background:none; border-radius:99px; padding:5px 14px; font:inherit; font-size:12.5px; font-weight:600; color:var(--mut); cursor:pointer; }
  .seg button.on { background:var(--ink); color:#fff; }
  #filesview { display:none; grid-template-columns:220px minmax(0,1fr) 380px; gap:18px; padding:6px 32px 120px; }
  body.files #filesview { display:grid; } body.files main { display:none; }
  @media (max-width:1100px) { #filesview { grid-template-columns:1fr; } }
  .side { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:12px 8px; align-self:start; }
  .side h2 { padding:0 8px; margin-top:8px; }
  .side .it { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; font-size:13px; cursor:pointer; }
  .side .it:hover { background:var(--soft); }
  .side .it.on { background:var(--blue); color:#fff; }
  .side .it.on small { color:rgba(255,255,255,.8); }
  .side .it i { width:9px; height:9px; border-radius:3px; flex:none; }
  .side .it span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side .it small { color:var(--mut); font-size:11.5px; }
  .list { background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; align-self:start; }
  .list table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .list th { text-align:left; font-size:11px; font-weight:600; color:var(--mut); padding:10px 12px; border-bottom:1px solid var(--line); }
  .list td { padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .list tr:last-child td { border-bottom:0; }
  .list tbody tr { cursor:pointer; }
  .list tbody tr:hover { background:var(--soft); }
  .list tbody tr.on { background:#e8f1fd; }
  .list .fname { display:flex; align-items:center; gap:8px; font-weight:500; max-width:320px; overflow:hidden; text-overflow:ellipsis; }
  .list .ficon { width:22px; height:28px; border-radius:4px; background:var(--soft); border:1px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .list .mut { color:var(--mut); }
  .list .access { margin:0; }
  .schema { padding:12px 14px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .schema b { font-size:13px; }
  .schema .chips { margin-top:8px; }
  .insp { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:16px; align-self:start; position:sticky; top:12px; }
  .insp h3 { margin:0; font-size:15px; }
  .insp .fn { font-size:12px; color:var(--mut); margin:3px 0 12px; word-break:break-all; }
  .insp .pv { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
  .insp .pv img { height:150px; border-radius:6px; border:1px solid var(--line); cursor:zoom-in; }
  .insp table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .insp td { padding:6px 0; border-top:1px solid var(--line); vertical-align:top; }
  .insp td:first-child { color:var(--mut); width:40%; padding-right:10px; }
  .insp td.missing { color:var(--line); }
  .insp .sec { font-size:11px; font-weight:600; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; }
  /* phone mirror (receiver/tools/phonescreen) */
  .phone { position:fixed; right:24px; bottom:24px; width:min(300px, 26vw); aspect-ratio:9/19.5; background:#000; border-radius:34px; padding:7px;
    box-shadow:0 0 0 1.5px #3a3a3c, 0 18px 50px rgba(0,0,0,.28); z-index:5; display:none; }
  .phone.show { display:block; animation:enter .4s; }
  .phone .scr { position:relative; width:100%; height:100%; border-radius:27px; overflow:hidden; background:#111; }
  .phone img { width:100%; height:100%; object-fit:cover; display:block; }
  .phone svg { position:absolute; inset:0; width:100%; height:100%; }
  .phone .cnt { position:absolute; top:34px; left:16px; color:#fff; font:800 52px/1 ui-rounded, -apple-system, sans-serif; text-shadow:0 1px 6px rgba(0,0,0,.4); }
  .phone .off { position:absolute; top:90px; left:16px; color:#ff453a; font-size:11px; font-weight:600; }
  .phone .cue { position:absolute; top:36px; right:14px; padding:7px 14px; border-radius:99px; font-weight:700; font-size:17px; color:#fff; }
  .phone .cue.next { background:#34c759; } .phone .cue.rescan { background:#ff3b30; }
  .phone .btn { position:absolute; bottom:22px; right:14px; padding:10px 24px; border-radius:99px; font-weight:700; font-size:15px; color:#fff; background:#34c759; }
  .phone .btn.stop { background:#ff3b30; }
  .phone .isl { position:absolute; top:9px; left:50%; transform:translateX(-50%); width:31%; height:22px; background:#000; border-radius:99px; }
  .phone .lbl { position:absolute; top:-22px; left:0; right:0; text-align:center; font-size:11px; font-weight:600; color:var(--mut); }
  body.hasphone main, body.hasphone #filesview { padding-right:calc(min(300px, 26vw) + 48px); }
  .done-banner { background:var(--card); border-radius:16px; padding:14px 18px; box-shadow:var(--shadow); margin:0 32px 12px; font-weight:500; display:none; }
</style>
</head>
<body>
<header>
  <div class="title"><span class="dot" id="dot"></span><span id="stitle">Scanning session</span></div>
  <div class="counters">
    <div class="counter"><b id="c-pages">0</b><span>pages</span></div>
    <div class="counter"><b id="c-docs">0</b><span>documents</span></div>
    <div class="counter"><b id="c-ents">0</b><span>people &amp; orgs</span></div>
    <div class="counter"><b id="c-issues">0</b><span>need attention</span></div>
  </div>
  <div class="seg" id="seg"><button data-view="board" class="on">Board</button><button data-view="files">Files</button></div>
  <div class="viewer">Viewing as <select id="viewer"><option>Admin</option><option>Public</option></select></div>
  <div class="controls">
    <button id="play">▶ Replay</button><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
  </div>
</header>
<div class="done-banner" id="banner"></div>
<main>
  <div class="col"><h2>Incoming</h2><div id="incoming"></div></div>
  <div class="col"><h2>Documents</h2><div id="boxes"><div class="empty">Waiting for the first page…</div></div></div>
  <div class="col">
    <div class="panel"><h2>People &amp; organizations</h2><div id="entities"><div class="empty">None yet</div></div></div>
    <div class="panel"><h2>Needs attention</h2><div id="issues"><div class="empty">Nothing yet</div></div></div>
    <div class="panel"><h2>Agent</h2><div class="feed" id="feed"></div></div>
  </div>
</main>
<section id="filesview">
  <div class="side" id="fside"></div>
  <div class="list" id="flist"></div>
  <div class="insp" id="finsp"><div class="empty">Select a file</div></div>
</section>
<div class="phone" id="phone"><div class="lbl">iPhone · live</div><div class="scr"><img id="phoneimg" alt="">
  <svg viewBox="0 0 1 1" preserveAspectRatio="none"><polygon id="pquad" points="" vector-effect="non-scaling-stroke" stroke-width="3"/></svg>
  <div class="isl"></div><div class="cnt" id="pcnt">0</div><div class="off" id="poff"></div><div class="cue" id="pcue"></div><div class="btn" id="pbtn">Start</div></div></div>
<div class="lightbox" id="lightbox"><div class="lbstage" id="lbstage"><img id="lbimg" alt=""><svg id="lbsvg" viewBox="0 0 1 1" preserveAspectRatio="none"></svg></div><div class="cap" id="lbcap"></div></div>
<div class="voicebar" id="voicebar"><span>🎙</span><span id="vtext"></span><span class="a" id="vaction"></span></div>

<script src="events.js"></script>
<script>
// State is built only from events, so the same page can be driven by a replay or a live event stream.
const S = { pages:{}, docs:{}, boxes:[], ents:{}, issues:[], feed:[] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ETYPE = { person:'People', org:'Organizations', agency:'Agencies', address:'Addresses' };
const SEV = { high:'var(--red)', med:'var(--orange)', low:'var(--mut)' };
const PALETTE = ['#0a84ff', '#ff9f0a', '#30b0c7', '#bf5af2', '#34c759', '#ff375f', '#5e5ce6', '#a2845e'];
const colors = {};
const col = k => colors[k] || (colors[k] = PALETTE[Object.keys(colors).length % PALETTE.length]);

// Access levels. Each doc may carry access {level, parties[], reason}. The viewer switch shows what
// each party would see: Admin sees all; public docs are open to everyone; internal to any named
// party; restricted and privileged only to the parties listed. This is a view, not enforcement:
// the receiver still serves every event and file to anyone who can reach it.
const LEVEL = { public:'Public', internal:'Internal', restricted:'Restricted', privileged:'Privileged' };
let viewer = 'Admin';
const lvl = d => (d && d.access && d.access.level) || 'internal';
function canSee(d) {
  if (!d || viewer === 'Admin') return true;
  const l = lvl(d);
  if (l === 'public') return true;
  if (viewer === 'Public') return false;
  if (l === 'internal') return true;
  return (d.access.parties || []).includes(viewer);
}
const pageLocked = n => { const p = S.pages[n]; return !!(p && p.doc && !canSee(S.docs[p.doc])); };
const entVisible = e => [...e.docs].some(id => !S.docs[id] || canSee(S.docs[id]));
const issueVisible = i => !S.docs[i.doc] || canSee(S.docs[i.doc]);
function accessBadge(d) {
  const l = lvl(d), who = (d.access && d.access.parties || []).join(', ');
  return `<div class="access ${l}">${l === 'public' ? '' : '🔒 '}${LEVEL[l]}${who && l !== 'public' ? ` <small>· ${esc(who)}</small>` : ''}</div>`;
}
function syncViewers() {
  const parties = new Set();
  Object.values(S.docs).forEach(d => (d.access && d.access.parties || []).forEach(p => parties.add(p)));
  const want = ['Admin', ...[...parties].sort(), 'Public'];
  const sel = $('viewer');
  if ([...sel.options].map(o => o.value).join('|') === want.join('|')) return;
  sel.innerHTML = want.map(v => `<option${v === viewer ? ' selected' : ''}>${esc(v)}</option>`).join('');
}
function rerender() {
  Object.keys(S.pages).forEach(n => renderIncoming(n));
  Object.values(S.docs).forEach(d => renderDoc(d, false, d, true));
  renderEntities(); renderIssues(false); counters(); renderFiles();
}

// Files view: folders are boxes, files are documents, data models are the union of fields per doc type.
let fsel = 'all', fdoc = null;
const slug = t => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48);
const fileName = d => `${d.date || 'undated'}_${slug(d.title)}.pdf`;
const models = () => {
  const m = {};
  Object.values(S.docs).forEach(d => { const k = d.doctype || 'Document'; (m[k] = m[k] || { docs:[], fields:[] }).docs.push(d);
    Object.keys(d.fields || {}).forEach(f => { if (!m[k].fields.includes(f)) m[k].fields.push(f); }); });
  return m;
};
function renderFiles() {
  if (!document.body.classList.contains('files')) return;
  const docs = Object.values(S.docs), M = models();
  const boxes = S.boxes.map(k => docs.find(d => d.boxkey === k)).filter(Boolean);
  $('fside').innerHTML = `<div class="it ${fsel === 'all' ? 'on' : ''}" data-f="all"><span>All documents</span><small>${docs.length}</small></div>
    <h2>Folders</h2>${boxes.map(b => `<div class="it ${fsel === 'box:' + b.boxkey ? 'on' : ''}" data-f="box:${esc(b.boxkey)}"><i style="background:${col(b.boxkey)}"></i><span>${esc(b.box)}</span><small>${docs.filter(d => d.boxkey === b.boxkey).length}</small></div>`).join('') || '<div class="empty" style="padding:0 8px">None yet</div>'}
    <h2>Data models</h2>${Object.entries(M).map(([k, v]) => `<div class="it ${fsel === 'model:' + k ? 'on' : ''}" data-f="model:${esc(k)}"><span>${esc(k)}</span><small>${v.fields.length} field${v.fields.length === 1 ? '' : 's'}</small></div>`).join('') || '<div class="empty" style="padding:0 8px">None yet</div>'}`;
  const shown = docs.filter(d => fsel === 'all' || fsel === 'box:' + d.boxkey || fsel === 'model:' + (d.doctype || 'Document'));
  const mk = fsel.startsWith('model:') && M[fsel.slice(6)];
  $('flist').innerHTML = (mk ? `<div class="schema"><b>${esc(fsel.slice(6))}</b> · data model inferred from ${mk.docs.length} document${mk.docs.length > 1 ? 's' : ''}<div class="chips">${mk.fields.map(f => `<span class="chip">${esc(f)} <b>${mk.docs.filter(d => d.fields && d.fields[f]).length}/${mk.docs.length}</b></span>`).join('')}</div></div>` : '') +
    (shown.length ? `<table><thead><tr><th>Name</th><th>Type</th><th>Date</th><th>Pages</th><th>Access</th></tr></thead><tbody>${shown.map(d => {
      const ok = canSee(d);
      return `<tr class="${d.id === fdoc ? 'on' : ''}" data-d="${d.id}"><td><div class="fname"><span class="ficon">${ok ? 'PDF' : '🔒'}</span>${ok ? esc(fileName(d)) : 'Restricted document'}</div></td>
        <td class="mut">${esc(d.doctype)}</td><td class="mut">${ok ? esc(d.date) : '—'}</td><td class="mut">${d.pages.length}</td><td>${accessBadge(d)}</td></tr>`; }).join('')}</tbody></table>`
      : '<div class="empty" style="padding:14px">No documents yet</div>');
  const d = S.docs[fdoc];
  if (!d) { $('finsp').innerHTML = '<div class="empty">Select a file to see its pages and fields</div>'; return; }
  if (!canSee(d)) { $('finsp').innerHTML = `<h3>Restricted document</h3><div class="fn">${esc(d.doctype)} · ${d.pages.length} page${d.pages.length > 1 ? 's' : ''}</div>
    <div class="lockbody" style="display:flex;gap:12px;align-items:center"><div class="lockicon">🔒</div><div>Hidden from ${esc(viewer)}.</div></div>${accessBadge(d)}`; return; }
  const model = M[d.doctype || 'Document'];
  $('finsp').innerHTML = `<h3>${esc(d.title)}</h3><div class="fn">${esc(d.box)} / ${esc(fileName(d))}</div>
    <div class="pv">${d.pages.map(n => `<img src="${S.pages[n]?.img || ''}" data-n="${n}" alt="">`).join('')}</div>
    <div class="sec">${esc(d.doctype)} fields</div>
    <table>${model.fields.map(f => d.fields && d.fields[f] ? `<tr><td>${esc(f)}</td><td>${esc(d.fields[f])}</td></tr>` : `<tr><td>${esc(f)}</td><td class="missing">—</td></tr>`).join('')}</table>
    <div class="sec">File</div>
    <table><tr><td>Folder</td><td>${esc(d.box)}</td></tr><tr><td>Pages</td><td>${d.pages.map(n => '#' + n).join(', ')}</td></tr>
      <tr><td>Status</td><td>${d.status === 'complete' ? 'Complete' : 'Assembling'}</td></tr>${d.note ? `<tr><td>Agent note</td><td>${esc(d.note)}</td></tr>` : ''}</table>
    ${accessBadge(d)}${d.access && d.access.reason ? `<span style="font-size:12px;color:var(--mut)"> ${esc(d.access.reason)}</span>` : ''}`;
}
$('fside').onclick = e => { const it = e.target.closest('[data-f]'); if (it) { fsel = it.dataset.f; renderFiles(); } };
$('flist').onclick = e => { const tr = e.target.closest('[data-d]'); if (tr) { fdoc = tr.dataset.d; renderFiles(); } };
$('seg').onclick = e => { const b = e.target.closest('[data-view]'); if (!b) return;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  document.body.classList.toggle('files', b.dataset.view === 'files'); renderFiles(); };

function bump(id, v) { const el = $(id); if (el.textContent != v) { el.textContent = v; el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 700); } }
function counters() {
  bump('c-pages', Object.keys(S.pages).length); bump('c-docs', Object.keys(S.docs).length);
  bump('c-ents', Object.values(S.ents).filter(e => e.etype !== 'address' && entVisible(e)).length); bump('c-issues', S.issues.filter(issueVisible).length);
}

function apply(e) {
  if (e.type === 'session') {
    $('dot').className = 'dot ' + e.state;
    $('stitle').textContent = e.state === 'live' ? 'Scanning…' : 'Session complete';
    if (e.state === 'done') { $('banner').style.display = 'block'; $('banner').textContent = '✓ ' + e.summary; }
  }
  if (e.type === 'page') {
    const p = S.pages[e.n] = Object.assign(S.pages[e.n] || {}, e);
    renderIncoming(e.n, !p.rendered); p.rendered = true;
  }
  if (e.type === 'doc') {
    const isNew = !S.docs[e.id];
    const prev = S.docs[e.id];
    S.docs[e.id] = e;
    if (!S.boxes.includes(e.boxkey)) S.boxes.push(e.boxkey);
    e.pages.forEach(n => { if (S.pages[n]) { S.pages[n].doc = e.id; renderIncoming(n); } });
    renderDoc(e, isNew, prev);
    syncViewers();
    if (prev && lvl(prev) !== lvl(e)) { renderEntities(); renderIssues(false); }
  }
  if (e.type === 'entity') {
    const k = e.name; const was = S.ents[k];
    const x = S.ents[k] = was || { name:e.name, etype:e.etype, docs:new Set(), seen:new Set() };
    x.docs.add(e.doc); x.seen.add(e.seen);
    renderEntities(k, !was);
  }
  if (e.type === 'issue') { S.issues.push(e); renderIssues(true); }
  if (e.type === 'narration') { S.feed.unshift({text:e.text}); renderFeed(); }
  if (e.type === 'voice') {
    S.feed.unshift({text:`“${e.text}”` + (e.action ? ` → ${e.action}` : ''), v:true}); renderFeed();
    if (!e.dropped) showVoice(e);
  }
  counters();
  renderFiles();
}

function renderIncoming(n, isNew) {
  const p = S.pages[n]; let el = $('inc-' + n);
  if (!el) { el = document.createElement('div'); el.id = 'inc-' + n; el.className = 'inc enter'; $('incoming').prepend(el); }
  const locked = pageLocked(n);
  el.classList.toggle('locked', locked);
  const status = locked ? `<span class="s">🔒 ${LEVEL[lvl(S.docs[p.doc])]} · ${p.doc}</span>`
    : p.doc ? `<span class="s filed">→ ${p.doc} · ${esc(S.docs[p.doc]?.boxkey)}</span>`
    : p.state === 'captured' ? `<span class="s"><span class="spin"></span>uploading</span>`
    : p.state === 'reading' ? `<span class="s"><span class="spin"></span>reading</span>`
    : /DID NOT READ/.test(p.verdict || '') ? `<span class="s" style="color:var(--red)">didn't read — retake</span>`
    : `<span class="s"><span class="spin"></span>${p.words} words · agent filing</span>`;
  el.innerHTML = `<img src="${p.img}" data-n="${n}" alt=""><div><div class="n">Page ${n}</div>${status}</div>`;
}

function renderDoc(d, isNew, prev, quiet) {
  let box = $('box-' + d.boxkey);
  if (!box) {
    if ($('boxes').querySelector('.empty')) $('boxes').innerHTML = '';
    box = document.createElement('div'); box.className = 'box enter'; box.id = 'box-' + d.boxkey;
    box.innerHTML = `<div class="boxhead"><i style="background:${col(d.boxkey)}"></i><span>${esc(d.box)}</span><small id="boxn-${d.boxkey}"></small></div><div class="docs"></div>`;
    $('boxes').appendChild(box);
  }
  let card = $('doc-' + d.id);
  if (!card) { card = document.createElement('div'); card.id = 'doc-' + d.id; card.className = 'doc enter'; card.style.setProperty('--c', col(d.boxkey)); box.querySelector('.docs').appendChild(card); }
  else if (!quiet) { card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
  card.classList.toggle('locked', !canSee(d));
  if (!canSee(d)) {
    card.innerHTML = `
    <div class="top"><div><h3>Restricted document</h3><div class="meta">${esc(d.doctype)} · ${d.id}</div></div>
      <span class="pill ${d.status}">${d.status === 'complete' ? 'Complete' : 'Assembling'}</span></div>
    <div class="lockbody"><div class="lockicon">🔒</div><div><b>${d.pages.length} page${d.pages.length > 1 ? 's' : ''} hidden from ${esc(viewer)}</b>
      Visible to ${esc(lvl(d) === 'internal' ? 'named parties' : ['Admin', ...(d.access.parties || [])].join(', '))}</div></div>
    ${accessBadge(d)}`;
    const count = Object.values(S.docs).filter(x => x.boxkey === d.boxkey).length;
    $('boxn-' + d.boxkey).textContent = `${count} document${count > 1 ? 's' : ''}`;
    return;
  }
  const oldKeys = new Set(Object.keys(prev?.fields || {}));
  const waiting = d.status === 'open' && /page 1 not scanned/.test(d.note || '') ? `<div class="slot">page 1<br>?</div>` : '';
  const waiting2 = d.status === 'open' && /waiting for page 2/.test(d.note || '') ? `<div class="slot">page 2<br>?</div>` : '';
  card.innerHTML = `
    <div class="top"><div><h3>${esc(d.title)}</h3><div class="meta">${esc(d.doctype)} · ${esc(d.date)} · ${d.id}</div></div>
      <span class="pill ${d.status}">${d.status === 'complete' ? 'Complete' : 'Assembling'}</span></div>
    <div class="thumbs">${waiting}${d.pages.map((n, i) => `<figure><img src="${S.pages[n]?.img || ''}" data-n="${n}" alt=""><figcaption>p${i + 1 + (waiting ? 1 : 0)} · #${n}</figcaption></figure>`).join('')}${waiting2}</div>
    <dl class="fields">${Object.entries(d.fields).slice(0, 7).map(([k, v]) =>
      `<dt>${esc(k.replace(/_/g, ' '))}</dt><dd class="${prev && !oldKeys.has(k) ? 'new' : ''}">${esc(v)}</dd>`).join('')}</dl>
    ${d.note ? `<div class="note">${esc(d.note)}</div>` : ''}
    ${accessBadge(d)}${d.access && d.access.reason ? `<span class="meta"> ${esc(d.access.reason)}</span>` : ''}`;
  const count = Object.values(S.docs).filter(x => x.boxkey === d.boxkey).length;
  $('boxn-' + d.boxkey).textContent = `${count} document${count > 1 ? 's' : ''}`;
  if (isNew) card.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderEntities(changed, isNew) {
  const groups = {};
  Object.values(S.ents).filter(entVisible).forEach(e => (groups[e.etype] = groups[e.etype] || []).push(e));
  $('entities').innerHTML = Object.keys(ETYPE).filter(t => groups[t]).map(t => `<div class="etype">${ETYPE[t]}</div><div class="chips">${
    groups[t].map(e => `<span class="chip ${e.name === changed ? (isNew ? 'enter' : 'grow') : ''}" title="Seen as: ${esc([...e.seen].join(' · '))}">${esc(e.name)} <b>${e.docs.size}</b></span>`).join('')}</div>`).join('');
}

function renderIssues(isNew) {
  const shown = S.issues.filter(issueVisible);
  if (!shown.length) { $('issues').innerHTML = '<div class="empty">Nothing yet</div>'; return; }
  $('issues').innerHTML = shown.map((i, k) => `<div class="issue ${isNew && i === S.issues[S.issues.length - 1] ? 'enter' : ''}" style="--sev:${SEV[i.sev]}">
    <div class="h">${i.sev === 'high' ? 'Discrepancy' : i.sev === 'med' ? 'Conflict across documents' : 'Note'} · ${esc(i.doc)}</div>${esc(i.text)}</div>`).join('');
}

function renderFeed() {
  $('feed').innerHTML = S.feed.slice(0, 8).map((f, k) => `<div class="${f.v ? 'v' : ''} ${k === 0 ? 'enter' : ''}">${esc(f.text)}</div>`).join('');
}

let vtimer;
function showVoice(e) {
  $('vtext').textContent = '“' + e.text + '”'; $('vaction').textContent = e.action ? '→ ' + e.action : '';
  $('voicebar').classList.add('show'); clearTimeout(vtimer); vtimer = setTimeout(() => $('voicebar').classList.remove('show'), 4200);
}

// Click any page thumbnail to see the full scan (thumbnail first, then the full-resolution master).
document.addEventListener('click', e => {
  const img = e.target.closest('.inc img, .thumbs img, .insp .pv img');
  if (img) {
    const n = +(img.dataset.n || 0);
    if (pageLocked(n)) return;
    const full = img.getAttribute('src').replace('.thumb.jpg', '.jpg');
    $('lbimg').src = img.getAttribute('src');
    const hi = new Image(); hi.onload = () => { if ($('lightbox').classList.contains('show')) $('lbimg').src = full; }; hi.src = full;
    const p = S.pages[n] || {};
    $('lbcap').textContent = n ? `Page ${n}` + (p.doc ? ` · ${p.doc} · ${S.docs[p.doc]?.title || ''}` : '') + ' · B toggles word boxes · click or Esc to close' : 'click or Esc to close';
    showBoxes(img.getAttribute('src'));
    $('lightbox').classList.add('show');
    return;
  }
  if (e.target.closest('#lightbox')) $('lightbox').classList.remove('show');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('lightbox').classList.remove('show');
  if ((e.key === 'b' || e.key === 'B') && $('lightbox').classList.contains('show')) $('lbstage').classList.toggle('nobox');
});

// Word boxes from the receiver's OCR (<page>.full.json): normalized, top-left origin, in the upright
// image. When OCR read the page upside down, rotate the boxes 180° back onto the image as captured.
let boxFor = '';
async function showBoxes(src) {
  $('lbsvg').innerHTML = '';
  boxFor = src;
  let r;
  try { r = await (await fetch(src.replace('.thumb.jpg', '.full.json'), { cache:'no-store' })).json(); } catch { return; }
  if (boxFor !== src || !r?.lines) return;
  const down = r.orientation === 'down';
  $('lbsvg').innerHTML = r.lines.flatMap(l => l.words || []).map(w => {
    let [x, y, bw, bh] = w.b;
    if (down) { x = 1 - x - bw; y = 1 - y - bh; }
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}"><title>${esc(w.t)}</title></rect>`;
  }).join('');
}

// Replay driver. For live use, replace with an EventSource on the receiver that calls apply(event).
let speed = 1, timers = [];
function reset() {
  timers.forEach(clearTimeout); timers = [];
  Object.assign(S, { pages:{}, docs:{}, boxes:[], ents:{}, issues:[], feed:[] });
  $('incoming').innerHTML = ''; $('boxes').innerHTML = '<div class="empty">Waiting for the first page…</div>';
  $('entities').innerHTML = '<div class="empty">None yet</div>'; $('issues').innerHTML = '<div class="empty">Nothing yet</div>';
  $('feed').innerHTML = ''; $('banner').style.display = 'none'; $('dot').className = 'dot'; $('stitle').textContent = 'Scanning session';
  ['c-pages', 'c-docs', 'c-ents', 'c-issues'].forEach(id => $(id).textContent = 0);
  syncViewers(); fdoc = null; renderFiles();
}
$('viewer').onchange = e => { viewer = e.target.value; rerender(); };
function play() { reset(); window.REPLAY.forEach(e => timers.push(setTimeout(() => apply(e), e.at * 1000 / speed))); }
$('play').onclick = play;
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
  speed = +b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b)); play();
});
const LIVE = location.pathname.startsWith('/live');
async function liveLoop() {
  let since = 0;
  document.querySelector('.controls').style.display = 'none';
  $('stitle').textContent = 'Waiting for Start on the phone…';
  for (;;) {
    try {
      const r = await (await fetch('/api/events?since=' + since, {cache:'no-store'})).json();
      if (r.next < since) { since = 0; reset(); continue; }   // receiver restarted
      for (const e of r.events) {
        if (e.type === 'session' && e.state === 'live') reset();
        apply(e);
      }
      since = r.next;
    } catch (err) {}
    await new Promise(res => setTimeout(res, 400));
  }
}
// Phone mirror: the app posts ~10 preview frames a second with its UI state to /api/mirror (over the
// same link as uploads), and the board redraws the phone screen from them.
const QCOL = { searching:['#ffcc00','none'], stabilizing:['#ffcc00','rgba(255,204,0,A)'], captured:['#34c759','rgba(52,199,89,.35)'],
  waiting:['rgba(255,255,255,.5)','none'], duplicate:['#ff9f0a','rgba(255,159,10,.25)'], paused:['#8e8e93','none'] };
async function phoneMirror() {
  let url;
  for (;;) {
    try {
      const r = await fetch('/api/mirror?t=' + Date.now(), {cache:'no-store'});
      if (r.status !== 200) throw 0;
      const m = JSON.parse(atob(r.headers.get('X-Mirror') || '') || '{}');
      const next = URL.createObjectURL(await r.blob());
      $('phoneimg').src = next; if (url) URL.revokeObjectURL(url); url = next;
      $('pcnt').textContent = m.count ?? 0;
      $('poff').textContent = m.offline ? 'laptop offline' : '';
      $('pcue').className = 'cue ' + (m.running && m.cue ? m.cue : ''); $('pcue').textContent = m.running && m.cue ? (m.cue === 'rescan' ? 'Rescan' : 'Next') : '';
      $('pcue').style.display = m.running && m.cue ? '' : 'none';
      $('pbtn').textContent = m.running ? 'Stop' : 'Start'; $('pbtn').className = 'btn' + (m.running ? ' stop' : '');
      const [st, p] = String(m.state || 'paused').split(':'), [stroke, fill] = QCOL[st] || QCOL.paused;
      const q = $('pquad');
      q.setAttribute('points', m.quad ? m.quad.map(([x, y]) => `${x},${y}`).join(' ') : '');
      q.setAttribute('stroke', stroke); q.setAttribute('fill', fill.replace('A', String(0.35 * (+p || 0))));
      $('phone').classList.add('show'); document.body.classList.add('hasphone');
      await new Promise(res => setTimeout(res, 60));
    } catch (e) {
      $('phone').classList.remove('show'); document.body.classList.remove('hasphone');
      await new Promise(res => setTimeout(res, 1000));
    }
  }
}
if (LIVE) phoneMirror();
if (LIVE) liveLoop();
else if (location.hash === '#end') window.REPLAY.forEach(apply); else play();
</script>
</body>
</html>
