<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Scan</title>
<style>
  :root {
    --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b; --line:#e8e8ed; --soft:#f0f0f3;
    --blue:#0071e3; --green:#28a745; --orange:#f5a623; --red:#e5484d; --purple:#8e59ff;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --Holland:#0a84ff; --Byron:#ff9f0a; --Barnwell:#30b0c7; --PLCB:#bf5af2;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased; }
  header { display:flex; align-items:center; gap:28px; padding:22px 32px 14px; flex-wrap:wrap; }
  .title { font-size:22px; font-weight:600; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--mut); }
  .dot.live { background:var(--red); animation:pulse 1.6s infinite; }
  .dot.done { background:var(--green); }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }
  .counters { display:flex; gap:26px; margin-left:auto; }
  .counter b { display:block; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em; transition:color .4s; }
  .counter b.bump { color:var(--blue); }
  .counter span { font-size:11.5px; color:var(--mut); }
  .controls { display:flex; gap:6px; }
  .controls button { border:0; background:var(--card); box-shadow:var(--shadow); border-radius:99px; padding:6px 12px; font:inherit; font-size:12.5px; color:var(--ink); cursor:pointer; }
  .controls button.on { background:var(--ink); color:#fff; }
  main { display:grid; grid-template-columns:230px minmax(0,1fr) 340px; gap:22px; padding:6px 32px 120px; }
  @media (max-width:1100px) { main { grid-template-columns:1fr; } }
  h2 { font-size:12px; font-weight:600; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  .col { min-width:0; }
  .enter { animation:enter .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes enter { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
  .flash { animation:flash 1.1s ease-out; }
  @keyframes flash { 0% { box-shadow:0 0 0 3px rgba(0,113,227,.35), var(--shadow); } 100% { box-shadow:var(--shadow); } }

  /* incoming */
  .inc { display:flex; gap:10px; align-items:center; background:var(--card); border-radius:12px; padding:8px; margin-bottom:8px; box-shadow:var(--shadow); }
  .inc img { width:44px; height:58px; object-fit:cover; object-position:top; border-radius:6px; background:var(--soft); }
  .inc .n { font-weight:600; font-size:13px; }
  .inc .s { font-size:11.5px; color:var(--mut); }
  .inc .s.filed { color:var(--ink); }
  .spin { display:inline-block; width:9px; height:9px; border:1.5px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-1px; margin-right:4px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* documents */
  .box { margin-bottom:22px; }
  .boxhead { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; margin:0 0 10px; }
  .boxhead i { width:10px; height:10px; border-radius:3px; }
  .boxhead small { color:var(--mut); font-weight:400; font-size:12.5px; }
  .docs { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:12px; }
  .doc { background:var(--card); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); border-top:3px solid var(--c); }
  .doc .top { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .doc h3 { margin:0; font-size:14.5px; font-weight:600; letter-spacing:-.005em; }
  .doc .meta { font-size:12px; color:var(--mut); margin-top:2px; }
  .pill { font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px; white-space:nowrap; }
  .pill.open { background:#fff4e0; color:#a15c00; }
  .pill.complete { background:#e6f6ea; color:#1e7b34; }
  .thumbs { display:flex; gap:6px; margin:12px 0 10px; min-height:66px; }
  .thumbs figure { margin:0; text-align:center; }
  .thumbs img { width:50px; height:66px; object-fit:cover; object-position:top; border-radius:6px; border:1px solid var(--line); display:block; transition:transform .5s; }
  .thumbs figcaption { font-size:10.5px; color:var(--mut); margin-top:2px; }
  .thumbs .slot { width:50px; height:66px; border-radius:6px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:10.5px; color:var(--mut); text-align:center; }
  .fields { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12.5px; }
  .fields dt { color:var(--mut); white-space:nowrap; }
  .fields dd { margin:0; }
  .fields .new { animation:enter .5s; }
  .note { margin-top:9px; font-size:12px; color:var(--blue); }

  /* right column */
  .panel { background:var(--card); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .etype { font-size:11px; color:var(--mut); margin:8px 0 5px; }
  .etype:first-of-type { margin-top:0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--soft); border-radius:99px; padding:4px 10px; font-size:12.5px; }
  .chip b { font-size:11px; color:var(--mut); font-weight:600; }
  .chip.grow { animation:flash 1s; }
  .issue { border-left:3px solid var(--sev); padding:6px 0 6px 10px; margin-bottom:8px; font-size:12.5px; }
  .issue .h { font-size:11px; font-weight:600; color:var(--sev); text-transform:uppercase; letter-spacing:.04em; }
  .empty { color:var(--mut); font-size:12.5px; }
  .feed div { font-size:12.5px; padding:5px 0; border-top:1px solid var(--line); }
  .feed div:first-child { border-top:0; }
  .feed .v { color:var(--purple); }

  /* voice bar */
  .voicebar { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:rgba(29,29,31,.92); color:#fff; border-radius:99px;
    padding:10px 18px; font-size:14px; max-width:min(760px, 92vw); display:flex; gap:10px; align-items:center; box-shadow:0 10px 30px rgba(0,0,0,.2);
    opacity:0; transition:opacity .4s, transform .4s; pointer-events:none; }
  .voicebar.show { opacity:1; transform:translateX(-50%) translateY(-4px); }
  .voicebar .a { color:#a1a1a6; font-size:12.5px; white-space:nowrap; }
  .inc img, .thumbs img { cursor:zoom-in; }
  .lightbox { position:fixed; inset:0; background:rgba(245,245,247,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; z-index:10; cursor:zoom-out; padding:24px; }
  .lightbox.show { display:flex; animation:enter .25s ease-out; }
  .lightbox img { max-width:min(96vw, 1100px); max-height:88vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.18); background:#fff; }
  .lightbox .cap { font-size:13px; color:var(--mut); }
  .done-banner { background:var(--card); border-radius:16px; padding:14px 18px; box-shadow:var(--shadow); margin:0 32px 12px; font-weight:500; display:none; }
</style>
</head>
<body>
<header>
  <div class="title"><span class="dot" id="dot"></span><span id="stitle">Scanning session</span></div>
  <div class="counters">
    <div class="counter"><b id="c-pages">0</b><span>pages</span></div>
    <div class="counter"><b id="c-docs">0</b><span>documents</span></div>
    <div class="counter"><b id="c-ents">0</b><span>people &amp; orgs</span></div>
    <div class="counter"><b id="c-issues">0</b><span>need attention</span></div>
  </div>
  <div class="controls">
    <button id="play">▶ Replay</button><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
  </div>
</header>
<div class="done-banner" id="banner"></div>
<main>
  <div class="col"><h2>Incoming</h2><div id="incoming"></div></div>
  <div class="col"><h2>Documents</h2><div id="boxes"><div class="empty">Waiting for the first page…</div></div></div>
  <div class="col">
    <div class="panel"><h2>People &amp; organizations</h2><div id="entities"><div class="empty">None yet</div></div></div>
    <div class="panel"><h2>Needs attention</h2><div id="issues"><div class="empty">Nothing yet</div></div></div>
    <div class="panel"><h2>Agent</h2><div class="feed" id="feed"></div></div>
  </div>
</main>
<div class="lightbox" id="lightbox"><img id="lbimg" alt=""><div class="cap" id="lbcap"></div></div>
<div class="voicebar" id="voicebar"><span>🎙</span><span id="vtext"></span><span class="a" id="vaction"></span></div>

<script src="events.js"></script>
<script>
// State is built only from events, so the same page can be driven by a replay or a live event stream.
const S = { pages:{}, docs:{}, boxes:[], ents:{}, issues:[], feed:[] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ETYPE = { person:'People', org:'Organizations', agency:'Agencies', address:'Addresses' };
const SEV = { high:'var(--red)', med:'var(--orange)', low:'var(--mut)' };
const PALETTE = ['#0a84ff', '#ff9f0a', '#30b0c7', '#bf5af2', '#34c759', '#ff375f', '#5e5ce6', '#a2845e'];
const colors = {};
const col = k => colors[k] || (colors[k] = PALETTE[Object.keys(colors).length % PALETTE.length]);

function bump(id, v) { const el = $(id); if (el.textContent != v) { el.textContent = v; el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 700); } }
function counters() {
  bump('c-pages', Object.keys(S.pages).length); bump('c-docs', Object.keys(S.docs).length);
  bump('c-ents', Object.values(S.ents).filter(e => e.etype !== 'address').length); bump('c-issues', S.issues.length);
}

function apply(e) {
  if (e.type === 'session') {
    $('dot').className = 'dot ' + e.state;
    $('stitle').textContent = e.state === 'live' ? 'Scanning…' : 'Session complete';
    if (e.state === 'done') { $('banner').style.display = 'block'; $('banner').textContent = '✓ ' + e.summary; }
  }
  if (e.type === 'page') {
    const p = S.pages[e.n] = Object.assign(S.pages[e.n] || {}, e);
    renderIncoming(e.n, !p.rendered); p.rendered = true;
  }
  if (e.type === 'doc') {
    const isNew = !S.docs[e.id];
    const prev = S.docs[e.id];
    S.docs[e.id] = e;
    if (!S.boxes.includes(e.boxkey)) S.boxes.push(e.boxkey);
    e.pages.forEach(n => { if (S.pages[n]) { S.pages[n].doc = e.id; renderIncoming(n); } });
    renderDoc(e, isNew, prev);
  }
  if (e.type === 'entity') {
    const k = e.name; const was = S.ents[k];
    const x = S.ents[k] = was || { name:e.name, etype:e.etype, docs:new Set(), seen:new Set() };
    x.docs.add(e.doc); x.seen.add(e.seen);
    renderEntities(k, !was);
  }
  if (e.type === 'issue') { S.issues.push(e); renderIssues(true); }
  if (e.type === 'narration') { S.feed.unshift({text:e.text}); renderFeed(); }
  if (e.type === 'voice') {
    S.feed.unshift({text:`“${e.text}”` + (e.action ? ` → ${e.action}` : ''), v:true}); renderFeed();
    if (!e.dropped) showVoice(e);
  }
  counters();
}

function renderIncoming(n, isNew) {
  const p = S.pages[n]; let el = $('inc-' + n);
  if (!el) { el = document.createElement('div'); el.id = 'inc-' + n; el.className = 'inc enter'; $('incoming').prepend(el); }
  const status = p.doc ? `<span class="s filed">→ ${p.doc} · ${esc(S.docs[p.doc]?.boxkey)}</span>`
    : p.state === 'captured' ? `<span class="s"><span class="spin"></span>uploading</span>`
    : p.state === 'reading' ? `<span class="s"><span class="spin"></span>reading</span>`
    : /DID NOT READ/.test(p.verdict || '') ? `<span class="s" style="color:var(--red)">didn't read — retake</span>`
    : `<span class="s"><span class="spin"></span>${p.words} words · agent filing</span>`;
  el.innerHTML = `<img src="${p.img}" data-n="${n}" alt=""><div><div class="n">Page ${n}</div>${status}</div>`;
}

function renderDoc(d, isNew, prev) {
  let box = $('box-' + d.boxkey);
  if (!box) {
    if ($('boxes').querySelector('.empty')) $('boxes').innerHTML = '';
    box = document.createElement('div'); box.className = 'box enter'; box.id = 'box-' + d.boxkey;
    box.innerHTML = `<div class="boxhead"><i style="background:${col(d.boxkey)}"></i><span>${esc(d.box)}</span><small id="boxn-${d.boxkey}"></small></div><div class="docs"></div>`;
    $('boxes').appendChild(box);
  }
  let card = $('doc-' + d.id);
  if (!card) { card = document.createElement('div'); card.id = 'doc-' + d.id; card.className = 'doc enter'; card.style.setProperty('--c', col(d.boxkey)); box.querySelector('.docs').appendChild(card); }
  else { card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
  const oldKeys = new Set(Object.keys(prev?.fields || {}));
  const waiting = d.status === 'open' && /page 1 not scanned/.test(d.note || '') ? `<div class="slot">page 1<br>?</div>` : '';
  const waiting2 = d.status === 'open' && /waiting for page 2/.test(d.note || '') ? `<div class="slot">page 2<br>?</div>` : '';
  card.innerHTML = `
    <div class="top"><div><h3>${esc(d.title)}</h3><div class="meta">${esc(d.doctype)} · ${esc(d.date)} · ${d.id}</div></div>
      <span class="pill ${d.status}">${d.status === 'complete' ? 'Complete' : 'Assembling'}</span></div>
    <div class="thumbs">${waiting}${d.pages.map((n, i) => `<figure><img src="${S.pages[n]?.img || ''}" data-n="${n}" alt=""><figcaption>p${i + 1 + (waiting ? 1 : 0)} · #${n}</figcaption></figure>`).join('')}${waiting2}</div>
    <dl class="fields">${Object.entries(d.fields).slice(0, 7).map(([k, v]) =>
      `<dt>${esc(k.replace(/_/g, ' '))}</dt><dd class="${prev && !oldKeys.has(k) ? 'new' : ''}">${esc(v)}</dd>`).join('')}</dl>
    ${d.note ? `<div class="note">${esc(d.note)}</div>` : ''}`;
  const count = Object.values(S.docs).filter(x => x.boxkey === d.boxkey).length;
  $('boxn-' + d.boxkey).textContent = `${count} document${count > 1 ? 's' : ''}`;
  if (isNew) card.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderEntities(changed, isNew) {
  const groups = {};
  Object.values(S.ents).forEach(e => (groups[e.etype] = groups[e.etype] || []).push(e));
  $('entities').innerHTML = Object.keys(ETYPE).filter(t => groups[t]).map(t => `<div class="etype">${ETYPE[t]}</div><div class="chips">${
    groups[t].map(e => `<span class="chip ${e.name === changed ? (isNew ? 'enter' : 'grow') : ''}" title="Seen as: ${esc([...e.seen].join(' · '))}">${esc(e.name)} <b>${e.docs.size}</b></span>`).join('')}</div>`).join('');
}

function renderIssues(isNew) {
  $('issues').innerHTML = S.issues.map((i, k) => `<div class="issue ${isNew && k === S.issues.length - 1 ? 'enter' : ''}" style="--sev:${SEV[i.sev]}">
    <div class="h">${i.sev === 'high' ? 'Discrepancy' : i.sev === 'med' ? 'Conflict across documents' : 'Note'} · ${esc(i.doc)}</div>${esc(i.text)}</div>`).join('');
}

function renderFeed() {
  $('feed').innerHTML = S.feed.slice(0, 8).map((f, k) => `<div class="${f.v ? 'v' : ''} ${k === 0 ? 'enter' : ''}">${esc(f.text)}</div>`).join('');
}

let vtimer;
function showVoice(e) {
  $('vtext').textContent = '“' + e.text + '”'; $('vaction').textContent = e.action ? '→ ' + e.action : '';
  $('voicebar').classList.add('show'); clearTimeout(vtimer); vtimer = setTimeout(() => $('voicebar').classList.remove('show'), 4200);
}

// Click any page thumbnail to see the full scan (thumbnail first, then the full-resolution master).
document.addEventListener('click', e => {
  const img = e.target.closest('.inc img, .thumbs img');
  if (img) {
    const n = +(img.dataset.n || 0);
    const full = img.getAttribute('src').replace('.thumb.jpg', '.jpg');
    $('lbimg').src = img.getAttribute('src');
    const hi = new Image(); hi.onload = () => { if ($('lightbox').classList.contains('show')) $('lbimg').src = full; }; hi.src = full;
    const p = S.pages[n] || {};
    $('lbcap').textContent = n ? `Page ${n}` + (p.doc ? ` · ${p.doc} · ${S.docs[p.doc]?.title || ''}` : '') + ' · click or Esc to close' : 'click or Esc to close';
    $('lightbox').classList.add('show');
    return;
  }
  if (e.target.closest('#lightbox')) $('lightbox').classList.remove('show');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('lightbox').classList.remove('show'); });

// Replay driver. For live use, replace with an EventSource on the receiver that calls apply(event).
let speed = 1, timers = [];
function reset() {
  timers.forEach(clearTimeout); timers = [];
  Object.assign(S, { pages:{}, docs:{}, boxes:[], ents:{}, issues:[], feed:[] });
  $('incoming').innerHTML = ''; $('boxes').innerHTML = '<div class="empty">Waiting for the first page…</div>';
  $('entities').innerHTML = '<div class="empty">None yet</div>'; $('issues').innerHTML = '<div class="empty">Nothing yet</div>';
  $('feed').innerHTML = ''; $('banner').style.display = 'none'; $('dot').className = 'dot'; $('stitle').textContent = 'Scanning session';
  ['c-pages', 'c-docs', 'c-ents', 'c-issues'].forEach(id => $(id).textContent = 0);
}
function play() { reset(); window.REPLAY.forEach(e => timers.push(setTimeout(() => apply(e), e.at * 1000 / speed))); }
$('play').onclick = play;
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
  speed = +b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b)); play();
});
const LIVE = location.pathname.startsWith('/live');
async function liveLoop() {
  let since = 0;
  document.querySelector('.controls').style.display = 'none';
  $('stitle').textContent = 'Waiting for Start on the phone…';
  for (;;) {
    try {
      const r = await (await fetch('/api/events?since=' + since, {cache:'no-store'})).json();
      if (r.next < since) { since = 0; reset(); continue; }   // receiver restarted
      for (const e of r.events) {
        if (e.type === 'session' && e.state === 'live') reset();
        apply(e);
      }
      since = r.next;
    } catch (err) {}
    await new Promise(res => setTimeout(res, 400));
  }
}
if (LIVE) liveLoop();
else if (location.hash === '#end') window.REPLAY.forEach(apply); else play();
</script>
</body>
</html>
