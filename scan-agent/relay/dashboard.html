<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Session</title>
<style>
  :root {
    --bg: #0e1013; --panel: #15181d; --line: #252a31; --text: #e6e8eb; --dim: #8a929c; --faint: #5b626b;
    --accent: #6aa9ff; --ok: #4cc38a; --warn: #f0b44c; --bad: #ef6a6a; --chip: #1f242b;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .pill { padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--dim); font-size: 12px; }
  .pill.live { color: var(--ok); } .pill.live::before { content: "● "; }
  .pill.busy { color: var(--accent); }
  .stats { margin-left: auto; display: flex; gap: 18px; color: var(--dim); }
  .stats b { color: var(--text); font-size: 15px; margin-right: 4px; }
  select { background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  main { flex: 1; display: grid; grid-template-columns: 300px 1fr 420px; min-height: 0; }
  section { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  section:last-child { border-right: 0; }
  section > h2 { margin: 0; padding: 10px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--line); }
  .scroll { overflow-y: auto; flex: 1; padding: 10px; }

  /* capture */
  .cap { display: flex; gap: 10px; padding: 6px; border-radius: 8px; margin-bottom: 6px; animation: in .35s ease-out; }
  .cap img { width: 64px; height: 84px; object-fit: cover; border-radius: 4px; background: #222; flex: none; }
  .cap .placeholder { width: 64px; height: 84px; display: grid; place-items: center; background: var(--chip); color: var(--dim); border-radius: 4px; flex: none; text-align: center; font-size: 11px; }
  .cap .meta { min-width: 0; }
  .cap .id { font-family: var(--mono); color: var(--dim); font-size: 12px; }
  .cap.dim img { opacity: .35; }
  .cap.audio { background: #1a2130; }
  .cap.audio .q { font-style: italic; }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--chip); color: var(--dim); margin: 2px 4px 0 0; }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); } .badge.acc { color: var(--accent); }

  /* agent feed */
  .ev { padding: 4px 8px; border-left: 2px solid transparent; animation: in .25s ease-out; }
  .ev.ledger { border-color: var(--ok); font-size: 14px; padding: 6px 10px; margin: 4px 0; background: #13201a; border-radius: 0 6px 6px 0; }
  .ev.cmd { font-family: var(--mono); font-size: 11.5px; color: var(--faint); white-space: pre-wrap; word-break: break-all; }
  .ev.cmd::before { content: "$ "; color: var(--accent); }
  .ev.think { color: var(--dim); font-style: italic; }
  .ev.say { color: var(--text); border-color: var(--accent); }
  .ev.page, .ev.audio { color: var(--accent); font-family: var(--mono); font-size: 12px; }
  .ev.session, .ev.nudge { color: var(--warn); }
  .ev.error { color: var(--bad); }
  .ev .t { color: var(--faint); font-family: var(--mono); font-size: 11px; margin-right: 8px; }

  /* archive */
  .folder { margin-bottom: 12px; }
  .folder > .name { color: var(--dim); font-weight: 600; margin-bottom: 6px; }
  .folder > .name::before { content: "▸ "; color: var(--faint); }
  .doc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px 12px; animation: in .35s ease-out; }
  .doc .title { font-weight: 600; }
  .doc .file { font-family: var(--mono); font-size: 11px; color: var(--faint); word-break: break-all; }
  .doc .file a { color: inherit; }
  .fields { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin-top: 6px; font-size: 12px; }
  .fields .k { color: var(--dim); font-family: var(--mono); font-size: 11px; }
  .fields .v.low { color: var(--warn); }
  .review { color: var(--warn); font-size: 12px; margin-top: 4px; }
  .sub { padding: 10px 14px; border-top: 1px solid var(--line); max-height: 38%; overflow-y: auto; }
  .sub h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .type { margin-bottom: 8px; }
  .type .n { font-family: var(--mono); color: var(--accent); }
  .chip { display: inline-block; font-family: var(--mono); font-size: 11px; background: var(--chip); border-radius: 4px; padding: 0 5px; margin: 2px 3px 0 0; color: var(--dim); }
  .chip.new { color: var(--ok); }
  .ent { font-size: 12px; margin-bottom: 3px; } .ent .al { color: var(--faint); }
  .empty { color: var(--faint); padding: 20px; text-align: center; }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
</style>
</head>
<body>
<header>
  <h1>Scan Session</h1>
  <select id="pick"></select>
  <span id="status" class="pill">idle</span>
  <span id="agent" class="pill">agent idle</span>
  <span id="uploadState" class="pill">waiting for phone</span>
  <div class="stats">
    <span><b id="nUploaded">0</b>uploaded</span>
    <span><b id="nPages">0</b>pages</span>
    <span><b id="nDocs">0</b>documents</span>
    <span><b id="nEnt">0</b>entities</span>
    <span><b id="nRev">0</b>to review</span>
  </div>
</header>
<main>
  <section><h2>Capture · from phone</h2><div class="scroll" id="capture"></div></section>
  <section><h2>Agent · Codex</h2><div class="scroll" id="feed"></div></section>
  <section>
    <h2>Archive</h2>
    <div class="scroll" id="archive"></div>
    <div class="sub" id="schema"></div>
    <div class="sub" id="entities"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let sid = new URLSearchParams(location.search).get('s');
let ledger = null, arrivals = [], firstAt = null;
const seenFields = new Set();

async function sessionsList() {
  const list = await (await fetch('/sessions')).json();
  $('pick').innerHTML = list.map(x => `<option value="${x.sid}">${x.sid}${x.live ? ' · live' : ''}</option>`).join('');
  if (!sid && list.length) sid = list[0].sid;
  $('pick').value = sid;
  return list;
}
$('pick').onchange = e => { location.search = '?s=' + e.target.value; };

function feed(ev) {
  if (ev.sid && ev.sid !== sid) return;
  if (ev.kind === 'cmd' && /^bin\/ledger\b/.test(ev.text)) return; // its msg lines appear as ledger events
  if (['cmd_done', 'hello', 'turn'].includes(ev.kind)) {
    if (ev.kind === 'turn') { const busy = ev.text === 'agent working'; $('agent').textContent = busy ? 'agent working…' : 'agent idle'; $('agent').className = 'pill' + (busy ? ' busy' : ''); }
    return;
  }
  firstAt ??= ev.at;
  const el = document.createElement('div');
  el.className = 'ev ' + ev.kind;
  const t = ((ev.at - firstAt) / 1000).toFixed(0).padStart(3, ' ') + 's';
  const text = ev.kind === 'ledger' ? ev.msg : ev.kind === 'cmd' ? ev.text.slice(0, 400) : ev.text;
  el.innerHTML = `<span class="t">${t}</span>${esc(text)}`;
  const box = $('feed'); const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  box.appendChild(el);
  if (stick) box.scrollTop = box.scrollHeight;
  if (ev.kind === 'phone' && ev.text.startsWith('phone connected')) $('uploadState').textContent = 'phone connected';
  if (ev.kind === 'phone' && ev.text.startsWith('upload complete')) $('uploadState').textContent = ev.text;
  if (['phone_meta', 'page', 'audio'].includes(ev.kind)) {
    const index = arrivals.findIndex(a => a.id === ev.id);
    const current = index < 0 ? {} : arrivals[index];
    const next = { ...current, ...ev, t: current.t ?? ev.t, type: ev.type ?? current.type,
      kind: ev.kind === 'phone_meta' ? current.kind ?? ev.kind : ev.kind };
    if (index < 0) arrivals.push(next); else arrivals[index] = next;
    $('nUploaded').textContent = arrivals.filter(a => a.kind === 'page').length;
    if (ev.kind === 'phone_meta') $('uploadState').textContent = 'uploading from phone';
    renderCapture();
  }
  if (ev.kind === 'ledger') refresh();
}

function renderCapture() {
  const L = ledger ?? { pages: {}, notes: {} };
  const rows = arrivals.slice().sort((a, b) => a.t - b.t).map(a => {
    if (a.kind === 'audio' || a.type === 'audio') {
      const n = L.notes?.[a.id];
      return `<div class="cap audio"><div class="meta"><div class="id">🎙 ${a.id} · ${a.t.toFixed(1)}s ${n ? `<span class="badge acc">${esc(n.kind)}</span>` : `<span class="badge">${a.kind === 'audio' ? 'transcribing…' : 'uploading…'}</span>`}</div>
        <div class="q">${n ? '“' + esc(n.text) + '”' : ''}</div>${n?.applied ? `<div class="id">→ ${esc(n.applied)}</div>` : ''}</div></div>`;
    }
    const p = L.pages?.[a.id];
    const st = p?.status;
    const cls = { ok: 'ok', duplicate: 'bad', blank: 'warn', removed: 'bad', retake: 'warn' }[st] ?? '';
    const doc = p?.doc && L.documents?.[p.doc];
    return `<div class="cap ${st && st !== 'ok' ? 'dim' : ''}">${a.file ? `<img src="/files/${sid}/${a.file}" loading="lazy">` : '<div class="placeholder">uploading…</div>'}
      <div class="meta"><div class="id">${a.id} · ${a.t.toFixed(1)}s</div>
      ${p ? `<span class="badge ${cls}">${esc(st)}</span>` : `<span class="badge">${a.file ? 'processing…' : 'uploading…'}</span>`}
      ${p?.dup_of ? `<span class="badge">= ${esc(p.dup_of)}</span>` : ''}
      ${p?.quality && p.quality !== 'ok' ? `<span class="badge warn">${esc(p.quality)}</span>` : ''}
      ${doc ? `<div>${esc(doc.type?.replace(/_/g, ' '))}</div><div class="id">${esc(p.doc)}</div>` : ''}</div></div>`;
  });
  const box = $('capture'); box.innerHTML = rows.join('') || '<div class="empty">Waiting for the phone…</div>';
  box.scrollTop = box.scrollHeight;
}

function renderArchive() {
  const L = ledger; if (!L) return;
  const docs = Object.entries(L.documents ?? {});
  const groups = {};
  for (const [id, d] of docs) {
    const f = L.folders?.[d.folder];
    const key = f ? `Box ${f.box ?? '?'} / ${f.name}` : (d.file ? d.file.split('/').slice(1, -1).join(' / ') : 'Unfiled');
    (groups[key] ??= []).push([id, d]);
  }
  $('archive').innerHTML = Object.entries(groups).map(([name, ds]) => `<div class="folder"><div class="name">${esc(name)}</div>${ds.map(([id, d]) => {
    const fields = Object.entries(d.fields ?? {}).slice(0, 8).map(([k, v]) => {
      const c = d.confidence?.[k];
      return `<div class="k">${esc(k)}</div><div class="v ${c != null && c < 0.8 ? 'low' : ''}">${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</div>`;
    }).join('');
    const file = d.file ? `<div class="file"><a href="/files/${sid}/${encodeURI(d.file)}" target="_blank">${esc(d.file.split('/').pop())}</a></div>` : '';
    return `<div class="doc"><div><span class="badge acc">${esc(d.type)}</span><span class="badge">${esc(id)} · ${(d.pages ?? []).length}p</span><span class="badge ${d.state === 'filed' ? 'ok' : ''}">${esc(d.state ?? '')}</span></div>
      <div class="title">${esc(d.title)}</div>${file}<div class="fields">${fields}</div>
      ${(d.review ?? []).map(r => `<div class="review">⚠ ${esc(r.field)}: ${esc(r.reason)}</div>`).join('')}</div>`;
  }).join('')}</div>`).join('') || '<div class="empty">No documents yet</div>';

  $('schema').innerHTML = '<h3>Data model · inferred</h3>' + (Object.entries(L.schema ?? {}).map(([type, s]) =>
    `<div class="type"><span class="n">${esc(type)}</span> <span class="badge">${s.count ?? '?'} docs</span><div>${Object.keys(s.fields ?? {}).map(f => {
      const k = type + '.' + f, fresh = !seenFields.has(k); seenFields.add(k);
      return `<span class="chip ${fresh ? 'new' : ''}">${esc(f)}</span>`; }).join('')}</div></div>`).join('') || '<div class="empty">Learning…</div>');

  $('entities').innerHTML = '<h3>Entities</h3>' + (Object.values(L.entities ?? {}).sort((a, b) => (b.docs?.length ?? 0) - (a.docs?.length ?? 0)).slice(0, 30).map(e =>
    `<div class="ent"><span class="badge">${esc(e.kind)}</span>${esc(e.name)} <span class="badge">${e.docs?.length ?? 0} docs</span>${e.aliases?.length ? `<span class="al"> aka ${esc(e.aliases.join(' · '))}</span>` : ''}</div>`).join('') || '<div class="empty">—</div>');

  const pages = Object.keys(L.pages ?? {}).length;
  $('nPages').textContent = Math.max(pages, arrivals.filter(a => a.kind === 'page').length);
  $('nDocs').textContent = docs.length;
  $('nEnt').textContent = Object.keys(L.entities ?? {}).length;
  $('nRev').textContent = docs.reduce((n, [, d]) => n + (d.review?.length ?? 0), 0);
  $('status').textContent = L.status; $('status').className = 'pill' + (L.status === 'scanning' ? ' live' : '');
}

let pending = false;
async function refresh() {
  if (!sid || pending) return; pending = true;
  try { ledger = await (await fetch(`/sessions/${sid}/ledger`)).json(); renderArchive(); renderCapture(); } finally { pending = false; }
}

(async () => {
  await sessionsList();
  if (sid) for (const ev of await (await fetch(`/sessions/${sid}/log`)).json()) feed(ev);
  await refresh();
  const es = new EventSource('/events');
  es.onmessage = async m => {
    const ev = JSON.parse(m.data);
    if (ev.kind === 'session' && ev.text.startsWith('started') && ev.sid !== sid) { location.search = '?s=' + ev.sid; return; }
    feed(ev);
  };
  setInterval(refresh, 1500);
})();
</script>
</body>
</html>
